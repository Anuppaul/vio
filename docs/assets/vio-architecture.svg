<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="345" viewBox="0 0 1280 345" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">VIO architecture</title><desc id="svgDesc">Next.js interface, shared singing pitch and rhythm logic, Android background audio.</desc><defs>
<linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#11172B"/><stop offset="1" stop-color="#242548"/></linearGradient>
<linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#283255"/><stop offset="1" stop-color="#1A243E"/></linearGradient>
<linearGradient id="featured" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#29315A"/><stop offset="1" stop-color="#312A53"/></linearGradient>
<linearGradient id="wave" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#77E9C8"/><stop offset=".52" stop-color="#ADABFF"/><stop offset="1" stop-color="#F6B59B"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8A7EEB" stop-opacity=".48"/><stop offset="1" stop-color="#8A7EEB" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" fill-opacity=".055"/></pattern>
</defs><rect width="1280" height="345" rx="28" fill="url(#page)"/><rect width="1280" height="345" rx="28" fill="url(#dots)"/><text x="37" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#7BE7C9" font-weight="790" letter-spacing="2">HOW VIO WORKS</text><rect x="37" y="86" width="376" height="207" rx="24" fill="url(#card)" stroke="#BDB9F4" stroke-opacity=".22"/><text x="62" y="129" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#B8A9FF" font-weight="800" letter-spacing="1">01 · WEB &amp; PWA</text><text x="62" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#EEF3FF" font-weight="770" >Next.js · React</text><text x="62" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#B5BED6" font-weight="570" >Music practice interface</text><circle cx="432" cy="188" r="16" fill="#11172D" stroke="#B8A9FF" stroke-opacity=".6"/><text x="432" y="194" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#7BE7C9" font-weight="650" text-anchor="middle">›</text><rect x="452" y="86" width="376" height="207" rx="24" fill="url(#card)" stroke="#BDB9F4" stroke-opacity=".22"/><text x="477" y="129" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#B8A9FF" font-weight="800" letter-spacing="1">02 · AUDIO LOGIC</text><text x="477" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#EEF3FF" font-weight="770" >Pitch · Sa · Rhythm</text><text x="477" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#B5BED6" font-weight="570" >Live feedback &amp; audio assets</text><circle cx="847" cy="188" r="16" fill="#11172D" stroke="#B8A9FF" stroke-opacity=".6"/><text x="847" y="194" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#7BE7C9" font-weight="650" text-anchor="middle">›</text><rect x="867" y="86" width="376" height="207" rx="24" fill="url(#card)" stroke="#BDB9F4" stroke-opacity=".22"/><text x="892" y="129" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#7BE7C9" font-weight="800" letter-spacing="1">03 · ANDROID</text><text x="892" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#EEF3FF" font-weight="770" >Capacitor · Java / C++</text><text x="892" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#B5BED6" font-weight="570" >Native capture &amp; screen-off audio</text><text x="38" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#B5BED6" font-weight="540" >The browser stays lightweight; Android handles continuous playback with the screen off.</text></svg>