name: Build VIO Desktop

on:
  workflow_dispatch:
  push:
    branches: [feature/tauri2-desktop]
    paths:
      - 'src-tauri/**'
      - 'scripts/export-desktop.mjs'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'components/**'
      - 'lib/**'
      - 'app/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-deb
            target: deb
          - os: windows-2022
            label: windows-exe
            target: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Generate VIO platform icons
        run: npx tauri icon app/icon.png
      - name: Build installer
        run: npx tauri build --bundles ${{ matrix.target }}
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: vio-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
