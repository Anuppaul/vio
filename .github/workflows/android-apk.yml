name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'next.config.ts'
      - 'package.json'
      - 'scripts/*android*'
      - 'scripts/build-apk.mjs'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: vio-android-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VIO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Inspect dependency audit
        run: |
          npm audit --json > "$RUNNER_TEMP/vio-npm-audit.json" || true
          cat "$RUNNER_TEMP/vio-npm-audit.json"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build web version as a regression check
        run: npm run build
      - name: Build and verify installable Android test APK
        run: npm run android:apk
      - name: Install browser for bundled UI checks
        run: npx playwright install --with-deps chromium
      - name: Test bundled pages, audio and raw tuner
        run: npm run test:android:web
      - name: Upload APK and verification results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vio-android-apk
          path: |
            release/*.apk
            release/*.sha256
            release/build-*.json
            release/test-results/*.json
            release/test-results/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Collect reproducible native project sources
        run: |
          mkdir -p native-publish/android
          rsync -a --exclude='.gradle' --exclude='.idea' --exclude='build' --exclude='local.properties' --exclude='capacitor-cordova-android-plugins' --exclude='app/src/main/assets/' android/ native-publish/android/
          cp package-lock.json native-publish/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vio-native-source
          path: native-publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vio-android-build-diagnostics
          path: |
            android/app/build/reports/
            release/test-results/*.json
            release/test-results/*.png
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Refuse to publish an APK built from stale source
        env:
          BUILD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$BUILD_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vio-android-apk
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vio-native-source
          path: ./
      - name: Commit verified APK to the requested release folder
        run: |
          cd release
          sha256sum --check *.sha256
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android package-lock.json release
          git update-index --chmod=+x android/gradlew
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish verified VIO Android APK [skip ci]'
          git push origin HEAD:main
