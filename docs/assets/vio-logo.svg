<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="vioTitle vioDesc">
  <title id="vioTitle">VIO logo</title>
  <desc id="vioDesc">Geometric VIO lettermark on an indigo square with a soft violet gradient and mint music accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A36"/>
      <stop offset="1" stop-color="#302B57"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFCAFF"/>
    </linearGradient>
    <clipPath id="badgeClip"><rect x="2" y="2" width="156" height="156" rx="38"/></clipPath>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#A18AFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#A18AFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="156" height="156" rx="38" fill="url(#background)"/>
  <rect x="3" y="3" width="154" height="154" rx="37" fill="none" stroke="#B5A5F8" stroke-opacity=".52" stroke-width="2"/>
  <g clip-path="url(#badgeClip)"><circle cx="119" cy="48" r="68" fill="url(#halo)"/></g>
  <g fill="none" stroke="url(#letter)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 55 L46 107 L64 55"/>
    <path d="M74 55 L84 55 L84 107 L74 107 Z" fill="url(#letter)" stroke="none"/>
    <ellipse cx="116" cy="81" rx="17" ry="27"/>
  </g>
  <circle cx="133" cy="35" r="6" fill="#7BE7C9"/>
  <path d="M25 125 Q46 131 64 125 T103 125 T137 125" fill="none" stroke="#AFA4FF" stroke-opacity=".34" stroke-width="2"/>
</svg>
