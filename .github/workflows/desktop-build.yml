name: Build VIO Desktop

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-deb
            target: deb
          - os: windows-2022
            label: windows-exe
            target: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate VIO platform icons
        run: npm run desktop:icons
      - name: Validate locked Rust dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1
      - name: Build installer
        run: npx tauri build --bundles ${{ matrix.target }}
      - name: Upload built desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: vio-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Smoke test packaged web UI and microphone simulation
        run: npm run test:desktop:web
      - name: Upload passing browser smoke results
        uses: actions/upload-artifact@v4
        with:
          name: vio-desktop-smoke-${{ matrix.label }}
          path: |
            release/test-results/desktop-web-smoke.json
            release/test-results/raw-tuner-mobile.png
            release/test-results/scale-practice-mobile.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vio-desktop-diagnostics-${{ matrix.label }}
          path: release/test-results/
          if-no-files-found: ignore
          retention-days: 7
