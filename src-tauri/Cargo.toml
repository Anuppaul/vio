[package]
name = "vio"
version = "1.0.0"
description = "VIO violin practice suite"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = "=2.12.3"

# Linux WebKitGTK media capture is disabled by default.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
