 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".055"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8D76FF" stop-opacity=".38"/><stop offset="1" stop-color="#8D76FF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
 <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
</defs>
