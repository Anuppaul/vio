<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">VIO — Listen closer. Practice smarter.</title>
<desc id="desc">A professional open-source VIO banner showing live pitch detection, Tanpura, ear training and metronome for violinists.</desc>
<defs>
