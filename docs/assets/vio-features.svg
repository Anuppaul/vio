<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="842" viewBox="0 0 1280 842" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">VIO six practice tools</title><desc id="svgDesc">Six designed modules, including special singing Sa Re Ga Ma, live pitch feedback, Tanpura, Ear Tuner, note exercise, metronome.</desc><defs>
