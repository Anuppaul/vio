</defs><rect width="1280" height="842" rx="28" fill="url(#page)"/><rect width="1280" height="842" rx="28" fill="url(#dots)"/><text x="42" y="53" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#7BE7C9" font-weight="800" letter-spacing="2">SIX WAYS TO PRACTISE</text><text x="42" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" fill="#EEF3FF" font-weight="810" >One studio. Every note closer.</text><rect x="36" y="137" width="380" height="320" rx="22" fill="url(#featured)" stroke="#7BE7C9" stroke-opacity=".63"/><text x="61" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#7BE7C9" font-weight="770" letter-spacing=".7">01 / PITCH-PERFECT SINGING</text><polyline points="149.76999999999998,299.1 189.04,279.85 228.31,285.24 267.58,263.68 302.23,252.13" fill="none" stroke="#B8A9FF" stroke-width="2.1559999999999997" stroke-dasharray="6 7"/><circle cx="149.76999999999998" cy="299.1" r="9.24" fill="#7BE7C9"/><text x="149.76999999999998" y="322.97" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.780000000000001" fill="#7BE7C9" font-weight="760" text-anchor="middle">Sa</text><circle cx="189.04" cy="279.85" r="6.93" fill="#B8A9FF"/><text x="189.04" y="303.72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.780000000000001" fill="#EEF3FF" font-weight="760" text-anchor="middle">Re</text><circle cx="228.31" cy="285.24" r="6.93" fill="#B8A9FF"/><text x="228.31" y="309.11" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.780000000000001" fill="#EEF3FF" font-weight="760" text-anchor="middle">Ga</text><circle cx="267.58" cy="263.68" r="6.93" fill="#B8A9FF"/><text x="267.58" y="287.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.780000000000001" fill="#EEF3FF" font-weight="760" text-anchor="middle">Ma</text><circle cx="302.23" cy="252.13" r="6.93" fill="#B8A9FF"/><text x="302.23" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.780000000000001" fill="#EEF