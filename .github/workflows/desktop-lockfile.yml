name: Refresh VIO desktop dependency lock

on:
  push:
    branches: [feature/tauri2-desktop]
    paths:
      - '.github/workflows/desktop-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tauri2-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock Tauri CLI dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile on this feature branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(desktop): lock Tauri 2 CLI dependencies"
            git push origin HEAD:feature/tauri2-desktop
          fi
